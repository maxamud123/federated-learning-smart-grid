# Federated Learning Configuration
# cspell:words fedavg LSTM

experiment:
  name: "baseline_fedavg"
  description: "Baseline FedAvg with standard LSTM"
  random_seed: 42

server:
  address: "localhost:8080"
  num_rounds: 50
  fraction_fit: 1.0  # Use all clients
  fraction_evaluate: 1.0
  min_fit_clients: 3
  min_evaluate_clients: 3
  min_available_clients: 3

client:
  num_clients: 5
  local_epochs: 5
  batch_size: 32
  learning_rate: 0.001

model:
  type: "LSTM"
  input_size: 7
  hidden_size: 64
  num_layers: 2
  output_size: 1
  dropout: 0.2

optimization:
  compression:
    enabled: false
    method: "top-k"
    k: 0.1
  
  quantization:
    enabled: false
    bits: 8
  
  pruning:
    enabled: false
    sparsity: 0.3

data:
  dataset: "uci_household"
  sequence_length: 24
  train_test_split: 0.8
  num_samples_per_client: 5000

hardware:
  platform: "raspberry_pi_4"
  memory_limit_mb: 2048
  measure_energy: true
